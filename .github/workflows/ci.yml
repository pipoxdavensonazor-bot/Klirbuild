name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - run: npm run lint

      - run: npm test

      - run: npx tsc --noEmit

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Patched direct dependencies
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const lock = JSON.parse(readFileSync("package-lock.json", "utf8"));
            const min = { next: "15.5.29", zod: "4.6.6", "sanitize-html": "2.18.0" };
            const cmp = (a, b) => {
              const pa = a.split(".").map(Number);
              const pb = b.split(".").map(Number);
              for (let i = 0; i < 3; i++) {
                const d = (pa[i] || 0) - (pb[i] || 0);
                if (d) return d;
              }
              return 0;
            };
            for (const [name, floor] of Object.entries(min)) {
              const version = lock.packages?.["node_modules/" + name]?.version;
              if (!version || cmp(version, floor) < 0) {
                console.error(name + " " + version + " is below " + floor);
                process.exit(1);
              }
            }
          '

      - name: Dependency audit (high+)
        # Remaining highs need major bumps (Next 16, Prisma 7, Wrangler/miniflare).
        # Direct Next/Zod/sanitize-html floors are enforced above.
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Secret scan (Gitleaks)
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz" | tar xz
          ./gitleaks detect --source . --config .gitleaks.toml --verbose --redact --no-banner

      - name: KlirBuild security checks
        run: npm run security:check

  # secrets.* cannot be used in job-level `if:` — gate via a probe job output
  smoke-gate:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          SMOKE_BASE_URL: ${{ secrets.SMOKE_BASE_URL }}
        run: |
          if [ -n "$SMOKE_BASE_URL" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  smoke:
    needs: smoke-gate
    if: needs.smoke-gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Smoke (health + login + CRM optionnel)
        run: npm run smoke:test
        env:
          SMOKE_BASE_URL: ${{ secrets.SMOKE_BASE_URL }}
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}

  e2e:
    needs: smoke-gate
    if: needs.smoke-gate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke
        run: npm run e2e
        env:
          PLAYWRIGHT_BASE_URL: ${{ secrets.SMOKE_BASE_URL }}
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
