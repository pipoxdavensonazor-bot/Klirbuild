<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#004F6E" />
    <meta name="color-scheme" content="dark" />
    <title>KlirMarket</title>
    <style>
      :root {
        --brand: #004f6e;
        --accent: #f5c518;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: radial-gradient(ellipse at 50% 20%, #0a6b8f 0%, var(--brand) 55%, #003347 100%);
        color: #fff;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: max(1.5rem, env(safe-area-inset-top)) 1.25rem max(1.5rem, env(safe-area-inset-bottom));
        text-align: center;
      }
      .mark {
        width: 88px;
        height: 88px;
        border-radius: 22px;
        background: #fff;
        display: grid;
        place-items: center;
        margin-bottom: 1.25rem;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
      }
      .mark img {
        width: 64px;
        height: 64px;
        object-fit: contain;
      }
      h1 {
        margin: 0;
        font-size: 1.75rem;
        font-weight: 800;
        letter-spacing: -0.03em;
      }
      h1 span { color: var(--accent); }
      p {
        margin: 0.65rem 0 0;
        max-width: 22rem;
        color: rgba(255, 255, 255, 0.82);
        font-size: 0.95rem;
        line-height: 1.45;
      }
      .actions {
        margin-top: 1.5rem;
        display: flex;
        flex-wrap: wrap;
        gap: 0.65rem;
        justify-content: center;
      }
      a.btn, button.btn {
        appearance: none;
        border: 0;
        border-radius: 999px;
        padding: 0.7rem 1.2rem;
        font-weight: 700;
        font-size: 0.9rem;
        cursor: pointer;
        text-decoration: none;
      }
      .btn-primary {
        background: var(--accent);
        color: #003347;
      }
      .btn-ghost {
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.28);
      }
      .status {
        margin-top: 1rem;
        font-size: 0.8rem;
        color: rgba(255, 255, 255, 0.65);
        min-height: 1.2em;
      }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <div class="mark" aria-hidden="true">
      <img src="https://klirline.com/favicon.png" alt="" width="64" height="64" />
    </div>
    <h1>Klir<span>Market</span></h1>
    <p id="msg">Ouverture du marché Haïti…</p>
    <div class="actions hidden" id="actions">
      <button type="button" class="btn btn-primary" id="retry">Réessayer</button>
      <a class="btn btn-ghost" href="https://klirline.com" rel="noopener">Ouvrir dans le navigateur</a>
    </div>
    <p class="status" id="status"></p>
    <script>
      (function () {
        var TARGET = "https://klirline.com";
        var msg = document.getElementById("msg");
        var actions = document.getElementById("actions");
        var status = document.getElementById("status");
        var retry = document.getElementById("retry");

        function go() {
          // Capacitor normally loads TARGET via server.url; this is offline / misconfig fallback.
          location.replace(TARGET);
        }

        function showOffline() {
          msg.textContent = "Pas de connexion. Vérifiez votre réseau pour ouvrir KlirMarket.";
          actions.classList.remove("hidden");
          status.textContent = "Mode hors ligne — shell natif KlirMarket";
        }

        retry.addEventListener("click", function () {
          status.textContent = "Nouvelle tentative…";
          if (navigator.onLine === false) {
            showOffline();
            return;
          }
          go();
        });

        if (navigator.onLine === false) {
          showOffline();
          return;
        }

        // Brief branded splash then open live market (fallback only).
        setTimeout(go, 450);
      })();
    </script>
  </body>
</html>
